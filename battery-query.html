<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>电池型号查询 - Battery Finder</title>

    <!-- 轻量方案：不依赖重型OCR库，使用原生拍照+手动确认 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }
        .container { max-width: 100%; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #f7b731;
            font-size: 1.8rem;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(247, 183, 49, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(247, 183, 49, 0.2);
            margin-bottom: 16px;
        }
        .card h2 {
            color: #f7b731;
            font-size: 1.1rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #b0b0b0;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #2d3a5a;
            border-radius: 10px;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #f7b731;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-secondary {
            background: #2d3a5a;
            color: #e0e0e0;
        }
        .btn-secondary:active { background: #3d4a6a; }
        .btn-scan {
            background: linear-gradient(135deg, #00b894, #00a884);
            color: #fff;
        }
        .result-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #00b894;
            margin-bottom: 16px;
            display: none;
        }
        .result-card.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            color: #00b894;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-battery {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #f7b731;
        }
        .result-battery .model {
            color: #f7b731;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result-battery .specs {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .result-battery .specs span {
            color: #fff;
            font-weight: 500;
        }
        .result-alts {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border-left: 4px solid #6c5ce7;
        }
        .result-alts .alts-title {
            color: #6c5ce7;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .result-alts .alt-item {
            display: inline-block;
            background: #2d3a5a;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 4px 4px 4px 0;
        }
        .vehicle-info {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .vehicle-info .vin-display {
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        /* Scanner overlay */
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        .scanner-overlay.show { display: flex; }
        .scanner-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
        }
        .scanner-header h3 {
            color: #fff;
            font-size: 1rem;
        }
        .scanner-close {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .scanner-video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 80px;
            border: 3px solid #00b894;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f7b731, transparent);
            animation: scanLine 1.2s ease-in-out infinite;
            box-shadow: 0 0 10px #f7b731, 0 0 20px rgba(247,183,49,0.4);
            border-radius: 2px;
        }
        @keyframes scanLine {
            0% { top: 8%; }
            50% { top: 88%; }
            100% { top: 8%; }
        }
        .scanner-hint {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: #aaa;
            font-size: 0.9rem;
        }
        .scanner-captured {
            display: none;
            padding: 16px;
            background: #1a1a2e;
        }
        .scanner-captured.show { display: block; }
        .scanner-captured input {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3a5a;
            border-radius: 8px;
            background: #16213e;
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
        }
        .scanner-captured .btn-row { margin-top: 12px; }
        .scanner-controls {
            padding: 16px 20px;
            display: flex;
            justify-content: center;
        }
        .btn-snap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7b731, #faa61a);
            border: 4px solid #fff;
            color: #1a1a2e;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(247,183,49,0.5);
            transition: all 0.2s;
        }
        .btn-snap:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(247,183,49,0.3); }
        /* Tab switcher */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #2d3a5a;
            border: none;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f7b731;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Error state */
        .error-msg {
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid #e63946;
            border-radius: 8px;
            padding: 12px;
            color: #e63946;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔋 电池型号查询</h1>
        <p class="subtitle">输入车架号或选择车型，秒查适配电池</p>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick=\"switchTab('scan', event)\">📸 拍照识别</button>
            <button class="tab" onclick=\"switchTab('select', event)\">🚗 车型选择</button>
        </div>

        <!-- Tab 1: 原生拍照OCR + 手动输入 -->
        <div id="tab-scan" class="tab-content active">
            <div class="card">
                <h2>🔍 车架号查询</h2>
                <p style="color:#aaa;font-size:0.85rem;text-align:center;margin-bottom:14px;">
                    输入17位车架号（大陆），港澳可少于17位
                </p>
                
                <!-- 手动输入区 -->
                <div class="input-group">
                    <label>车架号 (VIN)</label>
                    <input type="text" id="vin-input" placeholder="如：LVKY9103LSX63950" 
                           maxlength="20" autocomplete="off" 
                           style="text-transform:uppercase;font-size:1.1rem;letter-spacing:2px;padding:14px;">
                </div>
                <div class="error-msg" id="vin-error">车架号格式不正确，请输入17位VIN码（不含I/O/Q）</div>
                
                <!-- 查询按钮 -->
                <button class="btn btn-primary" onclick="queryByVin()" 
                        style="width:100%;padding:16px;font-size:1.15rem;margin-top:10px;">
                    🔍 查询电池型号
                </button>

                
                <!-- 分隔线 -->
                <div style="border-top:1px solid #333;margin:20px 0 16px;padding-top:16px;">
                    <p style="color:#f7b731;font-size:0.9rem;text-align:center;margin-bottom:12px;">
                        📸 拍照识别（可选）
                    </p>
                    
                    <!-- 原生相机 -->
                    <input type="file" id="native-camera" accept="image/*" capture="environment" style="display:none">
                    <button onclick="document.getElementById('native-camera').click()" 
                            style="width:100%;padding:14px;font-size:1rem;background:#1e3a5f;color:#f7b731;border:2px solid #f7b731;border-radius:12px;font-weight:bold;cursor:pointer;margin-bottom:8px;">
                        📸 拍照识别车架号
                    </button>
                    
                    <!-- 相册选取 -->
                    <input type="file" id="album-pick" accept="image/*" style="display:none">
                    <button onclick="document.getElementById('album-pick').click()" 
                            style="width:100%;padding:12px;font-size:0.95rem;background:transparent;color:#888;border:1px solid #555;border-radius:10px;cursor:pointer;">
                        🖼️ 从相册选取照片
                    </button>
                </div>
            </div>
            
            <!-- 拍照结果展示区 -->
            <div id="photo-result" style="display:none;margin-top:16px" class="card">
                <p style="color:#f7b731;font-size:0.85rem;text-align:center;margin-bottom:8px;">
                    👆 长按上方图片 → 选择「识别文字」
                </p>
                <img id="result-img" style="width:100%;border-radius:8px;margin:8px 0;" alt="拍照结果">
                <p id="ocr-guide" style="color:#f7b731;font-size:0.85rem;text-align:center;margin:8px 0;"></p>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <input type="text" id="scanned-vin" placeholder="识别到的车架号会自动填入这里" 
                           style="flex:1;padding:12px;border-radius:8px;border:2px solid #f7b731;background:#16213e;color:#f7b731;font-size:1rem;text-transform:uppercase;letter-spacing:1px;"
                           oninput="this.value=this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'')">
                    <button onclick="queryByVIN()" 
                            style="padding:12px 20px;background:#f7b731;color:#1a1a2e;border:none;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;">
                        查询
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab 2: Vehicle Select -->
        <div id="tab-select" class="tab-content">
            <div class="card">
                <h2>🚗 选择车型</h2>
                <div class="input-group">
                    <label>品牌</label>
                    <select id="brand-select" onchange="onBrandChange()">
                        <option value="">-- 请选择品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>车系</label>
                    <select id="series-select" onchange="onSeriesChange()" disabled>
                        <option value="">-- 先选品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>年份</label>
                    <select id="year-select" disabled>
                        <option value="">-- 先选车系 --</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="queryByVehicle()" style="flex:2">查询电池型号</button>
                </div>
            </div>
        </div>

        <!-- Result Area -->
        <div class="result-card" id="result-card">
            <div class="result-title">✅ 查询结果</div>
            <div class="vehicle-info" id="vehicle-info"></div>
            <div class="result-battery">
                <div class="model" id="battery-model"></div>
                <div class="specs" id="battery-specs"></div>
            </div>
            <div class="result-alts" id="result-alts">
                <div class="alts-title">💡 替代型号</div>
                <div id="alt-models"></div>
            </div>
        </div>
    </div>

    <!-- Scanner Overlay -->
    <div class="scanner-overlay" id="scanner-overlay">
        <div class="scanner-header">
            <h3>📷 扫描车架号</h3>
            <button class="scanner-close" onclick="closeScanner()">关闭</button>
        </div>
        <div class="scanner-video-container">
            <video id="scanner-video" autoplay playsinline></video>
            <div class="scanner-frame"></div>
            <img id="snap-preview" style="display:none;width:100%;height:100%;object-fit:contain;border-radius:8px;" />
        </div>
        <div class="scanner-hint" id="scanner-hint">
            🎯 对准车架号，点拍照按钮
        </div>
        <div class="scanner-controls" id="scanner-controls">
            <button class="btn btn-snap" id="btn-snap" onclick="capturePhoto()">📸 拍照识别</button>
        </div>
        <div class="scanner-captured" id="scanner-captured">
            <div style="color:#f7b731;font-size:0.85rem;margin-bottom:8px;text-align:center;">🔤 输入车架号（大陆17位/港澳可少于17位）</div>
            <input type="text" id="scanned-vin-overlay" maxlength="17" placeholder="如：LVKY9103LSX63950" style="text-transform:uppercase;font-size:1.1rem;letter-spacing:2px;text-align:center;">
            <div class="btn-row" style="margin-top:14px;">
                <button class="btn btn-secondary" onclick="retakePhoto()">🔄 重拍</button>
                <button class="btn btn-primary" onclick="confirmScan()">✅ 确认查询</button>
            </div>
        </div>
    </div>

    <script>

    // ============ 初始化 ============
    document.addEventListener('DOMContentLoaded', function() {
        initBrandSelect();
            initNativeCamera();
    });

    function initBrandSelect() {
        const brandSelect = document.getElementById('brand-select');
        const brands = Object.keys(BATTERY_DB).sort();
        brands.forEach(brand => {
            const opt = document.createElement('option');
            opt.value = brand;
            opt.textContent = brand;
            brandSelect.appendChild(opt);
        });
    }

    function onBrandChange() {
        const brand = document.getElementById('brand-select').value;
        const seriesSelect = document.getElementById('series-select');
        const yearSelect = document.getElementById('year-select');
        
        seriesSelect.innerHTML = '<option value="">-- 请选择车系 --</option>';
        yearSelect.innerHTML = '<option value="">-- 先选车系 --</option>';
        yearSelect.disabled = true;
        
        if (!brand) {
            seriesSelect.disabled = true;
            return;
        }
        
        seriesSelect.disabled = false;
        const series = Object.keys(BATTERY_DB[brand] || {}).sort();
        series.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            seriesSelect.appendChild(opt);
        });
    }

    function onSeriesChange() {
        const brand = document.getElementById('brand-select').value;
        const series = document.getElementById('series-select').value;
        const yearSelect = document.getElementById('year-select');
        
        yearSelect.innerHTML = '<option value="">-- 请选择年份 --</option>';
        
        if (!brand || !series) {
            yearSelect.disabled = true;
            return;
        }
        
        yearSelect.disabled = false;
        const data = BATTERY_DB[brand]?.[series];
        if (data?.years) {
            data.years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            });
        }
    }

    // ============ Tab切换 ============
    function switchTab(tab, evt) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (evt && evt.target) evt.target.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    // ============ VIN查询 ============
    function validateVin(vin) {
        return vin.length >= 12 && vin.length <= 17 && /^[A-HJ-NPR-Z0-9]{12,17}$/i.test(vin);
    }

    function decodeVin(vin) {
        // 简化解码: 根据前缀判断
        const prefix = vin.substring(0, 3).toUpperCase();
        const info = VIN_DECODER[prefix] || '未知品牌';
        
        // 尝试匹配数据库
        const brand = Object.keys(BATTERY_DB).find(b => info.includes(b));
        
        return {
            prefix: prefix,
            maker: info,
            matchedBrand: brand || null,
            year: vin.charAt(9), // 位置9是年份代码(简化)
        };
    }

        function queryByVin() {
        try {
            const vinEl = document.getElementById('vin-input');
            if (!vinEl) { alert('错误：找不到VIN输入框'); return; }
            const vin = vinEl.value.trim().toUpperCase();
            
            if (!vin) { alert('请输入车架号'); return; }
            
            const errorEl = document.getElementById('vin-error');
            if (!validateVin(vin)) {
                if (errorEl) errorEl.classList.add('show');
                alert('车架号格式不正确\n要求：12-17位（字母A-Z不含I/O/Q + 数字）\n您输入了' + vin.length + '位：' + vin);
                return;
            }
            if (errorEl) errorEl.classList.remove('show');
            
            const decoded = decodeVin(vin);
            
            if (decoded.matchedBrand && BATTERY_DB[decoded.matchedBrand]) {
                const brandData = BATTERY_DB[decoded.matchedBrand];
                const firstSeries = Object.keys(brandData)[0];
                const data = brandData[firstSeries];
                
                showResult({
                    vehicle: decoded.maker + ' | VIN: ' + vin,
                    battery: data.battery,
                    specs: data.specs,
                    alts: data.alts || []
                });
            } else {
                // 品牌已识别，展示该品牌下的所有车型电池
                if (decoded.matchedBrand && BATTERY_DB[decoded.matchedBrand]) {
                    const brandData = BATTERY_DB[decoded.matchedBrand];
                    const seriesList = Object.keys(brandData);
                    // 取第一款作为主要推荐
                    const firstSeries = seriesList[0];
                    const data = brandData[firstSeries];
                    let altList = [];
                    // 收集所有子车型作为替代
                    seriesList.forEach(function(s) {
                        if (brandData[s].battery) altList.push(s + ': ' + brandData[s].battery);
                    });
                    showResult({
                        vehicle: decoded.maker + ' | VIN: ' + vin + ' (匹配品牌: ' + decoded.matchedBrand + ')',
                        battery: data.battery + ' [' + firstSeries + ']',
                        specs: data.specs + '
📋 该品牌下共有 ' + seriesList.length + ' 款车型，如不符请用「车型选择」精确匹配',
                        alts: altList
                    });
                } else {
                    showResult({
                        vehicle: '品牌: ' + decoded.maker + ' | VIN: ' + vin,
                        battery: '暂无此品牌电池数据',
                        specs: '建议：使用「车型选择」功能查询',
                        alts: []
                    });
                }
            }
        } catch(e) {
            alert('查询出错: ' + e.message);
            console.error('[queryByVin]', e);
        }
    }

        // ============ 车型查询 ============
    function queryByVehicle() {
        const brand = document.getElementById('brand-select').value;
        const series = document.getElementById('series-select').value;
        const year = document.getElementById('year-select').value;
        
        if (!brand || !series) {
            alert('请选择品牌和车系');
            return;
        }
        
        const data = BATTERY_DB[brand]?.[series];
        if (!data) {
            alert('未找到该车型数据');
            return;
        }
        
        const vehicleText = year ? `${brand} ${series} (${year})` : `${brand} ${series}`;
        
        showResult({
            vehicle: vehicleText,
            battery: data.battery,
            specs: data.specs,
            alts: data.alts || []
        });
    }

    // ============ 显示结果 ============
    function showResult(result) {
        try {
            console.log('[showResult] 开始显示结果:', result);
            const card = document.getElementById('result-card');
            if (!card) { console.error('[showResult] 找不到 result-card'); return; }
            
            const vehicleInfo = document.getElementById('vehicle-info');
            if (vehicleInfo) vehicleInfo.innerHTML = `
                <strong>📍 车型:</strong> <span class="vin-display">${result.vehicle}</span>
            `;
            
            const batteryModel = document.getElementById('battery-model');
            if (batteryModel) batteryModel.textContent = result.battery;
            
            const batterySpecs = document.getElementById('battery-specs');
            if (batterySpecs) batterySpecs.innerHTML = (result.specs || '').replace(/\|/g, '<br>').replace(/规格:/g, '<span>规格:</span>').replace(/极性:/g, '<span>极性:</span>').replace(/冷启动电流:/g, '<span>冷启动电流:</span>').replace(/启停/g, '<span>启停</span>');
            
            const altsDiv = document.getElementById('alt-models');
            const altsWrapper = document.getElementById('result-alts');
            if (altsDiv && altsWrapper) {
                if (result.alts && result.alts.length > 0) {
                    altsWrapper.style.display = 'block';
                    altsDiv.innerHTML = result.alts.map(alt => 
                        `<span class="alt-item">${alt}</span>`
                    ).join('');
                } else {
                    altsWrapper.style.display = 'none';
                    altsDiv.innerHTML = '';
                }
            }
            
            card.classList.add('show');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            console.log('[showResult] 显示完成');
        } catch(e) {
            console.error('[showResult] 错误:', e);
            alert('显示结果时出错: ' + e.message);
        }
    }

    // ============ 扫码功能 (轻量拍照+确认模式) ============
    let stream = null;
    let snapCanvas = null;
    let snapCtx = null;

    // 初始化原生相机（触发系统级OCR）
    function initNativeCamera() {
        document.getElementById('native-camera').addEventListener('change', handleNativeCapture);
        document.getElementById('album-pick').addEventListener('change', handleNativeCapture);
    }
    
    // 处理原生相机返回的图片 → 图像增强 → 显示引导用户长按识别
    function handleNativeCapture(e) {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = '';
        
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                
                // 1. 图像增强（对比度增强+区域裁剪）
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const cropW = Math.floor(w * 0.7);
                const cropH = Math.floor(h * 0.2);
                canvas.width = cropW * 2;
                canvas.height = cropH * 2;
                ctx.drawImage(img,
                    Math.floor(w * 0.15), Math.floor(h * 0.35), cropW, cropH,  // 源：中间区域
                    0, 0, cropW * 2, cropH * 2                                  // 目标：放大2倍
                );
                const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = id.data;
                for (let i = 0; i < d.length; i += 4) {
                    const f = 2.2;
                    d[i]   = Math.min(255, Math.max(0, f * (d[i] - 128) + 128));
                    d[i+1] = Math.min(255, Math.max(0, f * (d[i+1] - 128) + 128));
                    d[i+2] = Math.min(255, Math.max(0, f * (d[i+2] - 128) + 128));
                }
                ctx.putImageData(id, 0, 0);
                const enhanced = canvas.toDataURL('image/jpeg', 0.95);
                
                // 2. 显示增强后的图和输入框
                const resultDiv = document.getElementById('photo-result');
                document.getElementById('result-img').src = enhanced;
                
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                const isAndroid = /Android/.test(navigator.userAgent);
                const guide = isIOS ? '👆 长按图片 →「识别文字」提取车架号'
                          : isAndroid ? '👆 长按图片 →「识别图片中的文字」提取车架号'
                          : '👆 长按图片识别文字后，手动复制到下方输入框';
                
                document.getElementById('ocr-guide').innerHTML = guide;
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    // queryByVIN: 兼容拍照后的输入框
    function queryByVIN() {
        let vin = '';
        const inputEl = document.getElementById('vin-input');
        const scannedEl = document.getElementById('scanned-vin');
        const overlayEl = document.getElementById('scanned-vin-overlay');
        
        // 优先取拍照输入框的值
        if (scannedEl && scannedEl.value.trim()) {
            vin = scannedEl.value.trim().toUpperCase();
        } else if (overlayEl && overlayEl.value.trim()) {
            vin = overlayEl.value.trim().toUpperCase();
        } else if (inputEl) {
            vin = inputEl.value.trim().toUpperCase();
        }
        vin = vin.replace(/[^A-HJ-NPR-Z0-9]/g, '');
        if (inputEl) inputEl.value = vin;
        if (scannedEl) scannedEl.value = vin;
        if (overlayEl) overlayEl.value = vin;
        queryByVin();
    }
    
    function showManualInput() {
        closeScanner();
        setTimeout(() => {
            const inp = document.getElementById('vin-input');
            if (inp) { inp.focus(); inp.scrollIntoView(); }
        }, 100);
    }

    // [已废弃，由原生相机替代]
    function capturePhoto() {
        // 初始化 canvas
        if (!snapCanvas) {
            snapCanvas = document.createElement('canvas');
            snapCtx = snapCanvas.getContext('2d');
        }
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const hintEl = document.getElementById('scanner-hint');
        const controls = document.getElementById('scanner-controls');
        const captured = document.getElementById('scanner-captured');
        
        // iOS Safari兼容：视频可能未完全play
        if (!video.videoWidth && !video.videoHeight) {
            hintEl.innerHTML = '⚠️ 摄像头未就绪，请稍等1秒后重试';
            setTimeout(() => capturePhoto(), 1000);
            return;
        }
        
        if (!video.videoWidth || !video.videoHeight) {
            hintEl.innerHTML = '📸 已拍照，请输入车架号';
        }
        if (!video.videoWidth) return;
        
        // 振动反馈
        if (navigator.vibrate) navigator.vibrate(100);
        
        // 截取视频帧（全尺寸）
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        snapCanvas.width = vw;
        snapCanvas.height = vh;
        snapCtx.drawImage(video, 0, 0, vw, vh);
        
        // 显示拍照预览图
        preview.src = snapCanvas.toDataURL('image/jpeg', 0.9);
        preview.style.display = 'block';
        video.style.display = 'none';
        controls.style.display = 'none';
        hintEl.innerHTML = '📸 拍照完成！👇 长按下方图片可识别文字';
        
        // ========== 图像增强（提高可读性）==========
        (function enhanceImage() {
            try {
                const enhCanvas = document.createElement('canvas');
                const enhCtx = enhCanvas.getContext('2d');
                // 裁剪中间区域（车架号通常在画面中央）
                const cropW = Math.floor(vw * 0.6);
                const cropH = Math.floor(vh * 0.25);
                const cropX = Math.floor((vw - cropW) / 2);
                const cropY = Math.floor(vh * 0.35);
                enhCanvas.width = cropW * 2;  // 放大2倍
                enhCanvas.height = cropH * 2;
                enhCtx.drawImage(snapCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW*2, cropH*2);
                
                // 对比度增强
                const imgData = enhCtx.getImageData(0, 0, enhCanvas.width, enhCanvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const f = 2.0;  // 强对比度
                    d[i]   = Math.min(255, Math.max(0, f * (d[i] - 128) + 128));
                    d[i+1] = Math.min(255, Math.max(0, f * (d[i+1] - 128) + 128));
                    d[i+2] = Math.min(255, Math.max(0, f * (d[i+2] - 128) + 128));
                }
                enhCtx.putImageData(imgData, 0, 0);
                
                // 用增强后的图替换预览（更清晰方便长按识别）
                preview.src = enhCanvas.toDataURL('image/jpeg', 0.95);
            } catch(e) {
                console.log('图像增强跳过:', e.message);
            }
        })();
        
        // 显示输入确认区
        captured.classList.add('show');
        
        // 聚焦输入框（弹出键盘方便输入）
        setTimeout(() => {
            document.getElementById('scanned-vin').focus();
        }, 300);
    }

    // ========== 重拍 ==========
    function retakePhoto() {
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const hintEl = document.getElementById('scanner-hint');
        const controls = document.getElementById('scanner-controls');
        const captured = document.getElementById('scanner-captured');
        
        preview.style.display = 'none';
        preview.src = '';
        video.style.display = 'block';
        controls.style.display = 'flex';
        captured.classList.remove('show');
        document.getElementById('scanned-vin').value = '';
        hintEl.innerHTML = '🎯 对准车架号，保持稳定，重新拍照';
    }

    // ========== 关闭扫描 ==========
    function closeScanner() {
        const overlay = document.getElementById('scanner-overlay');
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const captured = document.getElementById('scanner-captured');
        const controls = document.getElementById('scanner-controls');
        
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        
        video.srcObject = null;
        preview.style.display = 'none';
        preview.src = '';
        video.style.display = 'block';
        controls.style.display = 'flex';
        captured.classList.remove('show');
        overlay.classList.remove('show');
        document.getElementById('scanned-vin').value = '';
        document.getElementById('scanner-hint').innerHTML = '🎯 对准车架号，点拍照按钮';
        snapCanvas = null;
        snapCtx = null;
    }

    // ========== 确认查询 ==========
    function confirmScan() {
        const vin = document.getElementById('scanned-vin').value.trim().toUpperCase();
        if (!validateVin(vin)) {
            alert('⚠️ 车架号格式不正确\n\n要求：17位字母数字组合\n示例：LVKY9103LSX63950\n\n请检查后重新输入');
            return;
        }
        document.getElementById('vin-input').value = vin;
        closeScanner();
        queryByVin();
    }

    // VIN输入自动大写
    document.getElementById('vin-input').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });

    document.getElementById('scanned-vin').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });
    </script>
