<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>电池型号查询 - Battery Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 100px;
        }
        .container { max-width: 100%; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #f7b731;
            font-size: 1.8rem;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(247, 183, 49, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(247, 183, 49, 0.2);
            margin-bottom: 16px;
        }
        .card h2 {
            color: #f7b731;
            font-size: 1.1rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #b0b0b0;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #2d3a5a;
            border-radius: 10px;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #f7b731;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-secondary {
            background: #2d3a5a;
            color: #e0e0e0;
        }
        .btn-secondary:active { background: #3d4a6a; }
        .btn-scan {
            background: linear-gradient(135deg, #00b894, #00a884);
            color: #fff;
        }
        .result-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #00b894;
            margin-bottom: 16px;
            display: none;
        }
        .result-card.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            color: #00b894;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-battery {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #f7b731;
        }
        .result-battery .model {
            color: #f7b731;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result-battery .specs {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .result-battery .specs span {
            color: #fff;
            font-weight: 500;
        }
        .result-alts {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border-left: 4px solid #6c5ce7;
        }
        .result-alts .alts-title {
            color: #6c5ce7;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .result-alts .alt-item {
            display: inline-block;
            background: #2d3a5a;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 4px 4px 4px 0;
        }
        .vehicle-info {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .vehicle-info .vin-display {
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        .scanner-overlay.show { display: flex; }
        .scanner-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
        }
        .scanner-header h3 {
            color: #fff;
            font-size: 1rem;
        }
        .scanner-close {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .scanner-video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 80px;
            border: 3px solid #00b894;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scanner-hint {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: #aaa;
            font-size: 0.9rem;
        }
        .scanner-captured {
            display: none;
            padding: 16px;
            background: #1a1a2e;
        }
        .scanner-captured.show { display: block; }
        .scanner-captured input {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d3a5a;
            border-radius: 8px;
            background: #16213e;
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
        }
        .scanner-captured .btn-row { margin-top: 12px; }
        .scanner-controls {
            padding: 16px 20px;
            display: flex;
            justify-content: center;
        }
        .btn-snap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7b731, #faa61a);
            border: 4px solid #fff;
            color: #1a1a2e;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(247,183,49,0.5);
            transition: all 0.2s;
        }
        .btn-snap:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(247,183,49,0.3); }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: #2d3a5a;
            border: none;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f7b731;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid #e63946;
            border-radius: 8px;
            padding: 12px;
            color: #e63946;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }
        
        /* 调试信息显示 */
        #js-error {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #e63946;
            color: #fff;
            padding: 10px;
            font-size: 0.8rem;
            z-index: 99999;
            display: none;
        }
        #js-error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔋 电池型号查询</h1>
        <p class="subtitle">输入车架号或选择车型，秒查适配电池</p>

        <!-- Tabs -->
        <div class="tabs">
            <a href="javascript:void(0)" id="tab-scan-btn" onclick="switchTab('scan')" style="flex:1;padding:12px;text-align:center;cursor:pointer;text-decoration:none;display:block;">📸 拍照识别</a>
            <a href="javascript:void(0)" id="tab-select-btn" onclick="switchTab('select')" style="flex:1;padding:12px;text-align:center;cursor:pointer;text-decoration:none;display:block;">🚗 车型选择</a>
        </div>

        <!-- Tab 1: VIN输入 + 拍照 -->
        <div id="tab-scan" class="tab-content active">
            <div class="card">
                <h2>🔍 车架号查询</h2>
                <p style="color:#aaa;font-size:0.85rem;text-align:center;margin-bottom:14px;">
                    输入17位车架号（大陆），港澳可少于17位
                </p>
                
                <!-- 手动输入区 -->
                <div class="input-group">
                    <label>车架号 (VIN)</label>
                    <input type="text" id="vin-input" placeholder="如：LVKY9103LSX63950" 
                           maxlength="20" autocomplete="off" 
                           style="text-transform:uppercase;font-size:1.1rem;letter-spacing:2px;padding:14px;">
                </div>
                <div class="error-msg" id="vin-error">车架号格式不正确，请输入17位VIN码（不含I/O/Q）</div>
                
                <!-- 查询按钮 -->
                <a href="javascript:void(0)" id="btn-query-vin" 
                   style="display:block;width:100%;padding:16px;font-size:1.15rem;margin-top:10px;text-align:center;text-decoration:none;box-sizing:border-box;cursor:pointer;"
                    🔍 查询电池型号
                </a>

                
                <!-- 分隔线 -->
                <div style="border-top:1px solid #333;margin:20px 0 16px;padding-top:16px;">
                    <p style="color:#f7b731;font-size:0.9rem;text-align:center;margin-bottom:12px;">
                        📸 拍照识别（可选）
                    </p>
                    
                    <!-- 原生相机 -->
                    <input type="file" id="native-camera" accept="image/*" capture="environment" style="display:none">
                    <a href="javascript:void(0)" id="btn-native-camera" 
                            style="width:100%;padding:14px;font-size:1rem;background:#1e3a5f;color:#f7b731;border:2px solid #f7b731;border-radius:12px;font-weight:bold;cursor:pointer;margin-bottom:8px;">
                        📸 拍照识别车架号
                    </a>
                    
                    <!-- 相册选取 -->
                    <input type="file" id="album-pick" accept="image/*" style="display:none">
                    <a href="javascript:void(0)" id="btn-album-pick" 
                            style="width:100%;padding:12px;font-size:0.95rem;background:transparent;color:#888;border:1px solid #555;border-radius:10px;cursor:pointer;">
                        🖼️ 从相册选取照片
                    </a>
                </div>
            </div>
            
            <!-- 拍照结果展示区 -->
            <div id="photo-result" style="display:none;margin-top:16px" class="card">
                <img id="result-img" style="width:100%;border-radius:8px;margin:8px 0;" alt="拍照结果">
                <p id="ocr-guide" style="color:#f7b731;font-size:0.85rem;text-align:center;margin:8px 0;"></p>
                <div style="display:flex;gap:8px;margin-top:10px;">
                    <input type="text" id="scanned-vin" placeholder="识别到的车架号会自动填入这里" 
                           style="flex:1;padding:12px;border-radius:8px;border:2px solid #f7b731;background:#16213e;color:#f7b731;font-size:1rem;text-transform:uppercase;letter-spacing:1px;"
                           oninput="this.value=this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'')">
                    <a href="javascript:void(0)" id="btn-query-scanned" 
                       style="padding:12px 20px;background:#f7b731;color:#1a1a2e;border:none;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;display:inline-block;text-decoration:none;text-align:center;min-width:60px;"
                        查询
                    </a>
                </div>
            </div>
        </div>

        <!-- Tab 2: Vehicle Select -->
        <div id="tab-select" class="tab-content">
            <div class="card">
                <h2>🚗 选择车型</h2>
                <div class="input-group">
                    <label>品牌</label>
                    <select id="brand-select">
                        <option value="">-- 请选择品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>车系</label>
                    <select id="series-select" disabled>
                        <option value="">-- 先选品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>年份</label>
                    <select id="year-select" disabled>
                        <option value="">-- 先选车系 --</option>
                    </select>
                </div>
                <div class="btn-row">
                    <a href="javascript:void(0)" id="btn-query-vehicle" onclick="queryByVehicle()" style="display:block;flex:2;padding:14px;text-align:center;cursor:pointer;text-decoration:none;">查询电池型号</a>
                </div>
            </div>
        </div>

        <!-- Result Area -->
        <div class="result-card" id="result-card">
            <div class="result-title">✅ 查询结果</div>
            <div class="vehicle-info" id="vehicle-info"></div>
            <div class="result-battery">
                <div class="model" id="battery-model"></div>
                <div class="specs" id="battery-specs"></div>
            </div>
            <div class="result-alts" id="result-alts">
                <div class="alts-title">💡 替代型号</div>
                <div id="alt-models"></div>
            </div>
        </div>
    </div>

    <!-- Scanner Overlay -->
    <div class="scanner-overlay" id="scanner-overlay">
        <div class="scanner-header">
            <h3>📷 扫描车架号</h3>
            <a href="javascript:void(0)" id="btn-close-scanner" onclick="closeScanner()" style="padding:8px 16px;cursor:pointer;">关闭</a>
        </div>
        <div class="scanner-video-container">
            <video id="scanner-video" autoplay playsinline></video>
            <div class="scanner-frame"></div>
            <img id="snap-preview" style="display:none;width:100%;height:100%;object-fit:contain;border-radius:8px;" />
        </div>
        <div class="scanner-hint" id="scanner-hint">
            🎯 对准车架号，点拍照按钮
        </div>
        <div class="scanner-controls" id="scanner-controls">
            <a href="javascript:void(0)" id="btn-snap" onclick="capturePhoto()" style="display:block;width:100%;padding:16px;cursor:pointer;text-align:center;">📸 拍照识别</a>
        </div>
        <div class="scanner-captured" id="scanner-captured">
            <div style="color:#f7b731;font-size:0.85rem;margin-bottom:8px;text-align:center;">🔤 输入车架号（大陆17位/港澳可少于17位）</div>
            <input type="text" id="scanned-vin-overlay" maxlength="17" placeholder="如：LVKY9103LSX63950" style="text-transform:uppercase;font-size:1.1rem;letter-spacing:2px;text-align:center;">
            <div class="btn-row" style="margin-top:14px;">
                <a href="javascript:void(0)" id="btn-retake" onclick="retakePhoto()" style="display:block;padding:12px;text-align:center;cursor:pointer;">🔄 重拍</a>
                <a href="javascript:void(0)" id="btn-confirm-scan" onclick="confirmScan()" style="display:block;padding:12px;text-align:center;cursor:pointer;">✅ 确认查询</a>
            </div>
        </div>
    </div>
    
    <!-- 错误显示区域 -->
    <div id="js-error"></div>

    <script>
    // ============ 全局错误捕获 ============
    window.onerror = function(msg, src, line, col, err) {
        var errorDiv = document.getElementById('js-error');
        if (errorDiv) {
            errorDiv.innerHTML = 'JS错误: ' + msg + ' (行' + line + ', 列' + col + ')';
            errorDiv.classList.add('show');
            setTimeout(function() { errorDiv.classList.remove('show'); }, 10000);
        }
        console.error('[Global Error]', msg, 'at line', line, 'col', col, err);
        return false;
    };
    
    window.addEventListener('error', function(e) {
        var errorDiv = document.getElementById('js-error');
        if (errorDiv) {
            errorDiv.innerHTML = 'JS错误: ' + e.message + ' (行' + e.lineno + ')';
            errorDiv.classList.add('show');
            setTimeout(function() { errorDiv.classList.remove('show'); }, 10000);
        }
        console.error('[Error Event]', e.error);
    });

    // ============ iOS Safari / 微信 WebView 兼容补丁 ============
    (function fixVideo() {
        document.addEventListener('touchstart', function() {
            var v = document.getElementById('scanner-video');
            if (v && v.srcObject && v.paused) {
                v.play().catch(function(){});
            }
        }, { once: true });
    })();

        // 丰田
        '丰田': {
            '卡罗拉': { years: ['2019-2024'], battery: '12V 70Ah', specs: '规格: 260×173×200mm | 极性: 极性朝向右侧', alts: ['汤浅6-QW-70', '统一6-QW-70', '风帆6-QW-70'] },

    // ============ 绑定所有事件 ============

                        switchTab('select');

    // ============ 初始化品牌下拉框 ============
    function initBrandSelect() {
        var brandSelect = document.getElementById('brand-select');
        if (!brandSelect) {
            console.error('[initBrandSelect] 找不到brand-select');
            return;
        }
        
        var brands = Object.keys(BATTERY_DB).sort();
        brands.forEach(function(brand) {
            var opt = document.createElement('option');
            opt.value = brand;
            opt.textContent = brand;
            brandSelect.appendChild(opt);
        });
    }

    // ============ 品牌变更 ============
    function onBrandChange() {
        var brand = document.getElementById('brand-select').value;
        var seriesSelect = document.getElementById('series-select');
        var yearSelect = document.getElementById('year-select');
        
        if (!seriesSelect || !yearSelect) {
            console.error('[onBrandChange] 找不到series-select或year-select');
            return;
        }
        
        seriesSelect.innerHTML = '<option value="">-- 请选择车系 --</option>';
        yearSelect.innerHTML = '<option value="">-- 先选车系 --</option>';
        yearSelect.disabled = true;
        
        if (!brand) {
            seriesSelect.disabled = true;
            return;
        }
        
        seriesSelect.disabled = false;
        var series = Object.keys(BATTERY_DB[brand] || {}).sort();
        series.forEach(function(s) {
            var opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            seriesSelect.appendChild(opt);
        });
    }

    // ============ 车系变更 ============
    function onSeriesChange() {
        var brand = document.getElementById('brand-select').value;
        var series = document.getElementById('series-select').value;
        var yearSelect = document.getElementById('year-select');
        
        if (!yearSelect) {
            console.error('[onSeriesChange] 找不到year-select');
            return;
        }
        
        yearSelect.innerHTML = '<option value="">-- 请选择年份 --</option>';
        
        if (!brand || !series) {
            yearSelect.disabled = true;
            return;
        }
        
        yearSelect.disabled = false;
        var data = (BATTERY_DB[brand] || {})[series];
        if (data && data.years) {
            data.years.forEach(function(y) {
                var opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            });
        }
    }

    // ============ Tab切换 ============
    function switchTab(tab) {
        // 清除所有tab按钮active状态
        var scanBtn = document.getElementById('tab-scan-btn');
        var selectBtn = document.getElementById('tab-select-btn');
        if (scanBtn) scanBtn.classList.remove('active');
        if (selectBtn) selectBtn.classList.remove('active');
        // 清除所有tab-content
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
        
        var targetTab = document.getElementById('tab-' + tab);
        if (targetTab) {
            targetTab.classList.add('active');
        }
        
        // 更新tab按钮状态
        if (tab === 'scan') {
            if (scanBtn) scanBtn.classList.add('active');
        } else if (tab === 'select') {
            if (selectBtn) selectBtn.classList.add('active');
        }
    }

    // ============ VIN验证 ============
    function validateVin(vin) {
        return vin.length >= 12 && vin.length <= 17 && /^[A-HJ-NPR-Z0-9]{12,17}$/i.test(vin);
    }

    // ============ VIN解码 ============
    function decodeVin(vin) {
        var prefix = vin.substring(0, 3).toUpperCase();
        var info = VIN_DECODER[prefix] || '未知品牌';
        
        var brand = null;
        var brands = Object.keys(BATTERY_DB);
        for (var i = 0; i < brands.length; i++) {
            if (info.indexOf(brands[i]) !== -1) {
                brand = brands[i];
                break;
            }
        }
        
        return {
            prefix: prefix,
            maker: info,
            matchedBrand: brand,
            year: vin.charAt(9)
        };
    }

    // ============ VIN查询（主） ============
    function queryByVin() {
        try {
            // ✅ 先清空之前的结果，避免显示旧数据
            var resultCard = document.getElementById('result-card');
            if (resultCard) {
                resultCard.innerHTML = '';
                resultCard.style.display = 'none';
            }
            
            var vinEl = document.getElementById('vin-input');
            if (!vinEl) {
                alert('错误：找不到VIN输入框');
                return;
            }
            var vin = vinEl.value.trim().toUpperCase();
            
            if (!vin) {
                alert('请输入车架号');
                return;
            }
            
            var errorEl = document.getElementById('vin-error');
            if (!validateVin(vin)) {
                if (errorEl) errorEl.classList.add('show');
                alert('车架号格式不正确\n要求：12-17位（字母A-Z不含I/O/Q + 数字）\n您输入了' + vin.length + '位：' + vin);
                return;
            }
            if (errorEl) errorEl.classList.remove('show');
            
            var decoded = decodeVin(vin);
                
            // ✅ 新逻辑：前6位精确匹配 → 前5位 → 前3位 → 展示所有车型让用户选择
            var matched = false;
            
            // 第1优先：前6位精确匹配
            if (vin.length >= 6 && VIN_PREFIX_BATTERY[vin.substring(0, 6)]) {
                var prefixData = VIN_PREFIX_BATTERY[vin.substring(0, 6)];
                showResult({
                    vehicle: prefixData.brand + ' ' + prefixData.model + ' | VIN: ' + vin,
                    battery: prefixData.battery,
                    specs: prefixData.specs,
                    alts: []
                });
                matched = true;
            }
            
            // 第2优先：前5位匹配
            if (!matched && vin.length >= 5) {
                for (var key in VIN_PREFIX_BATTERY) {
                    if (key.substring(0, 5) === vin.substring(0, 5)) {
                        var prefixData = VIN_PREFIX_BATTERY[key];
                        showResult({
                            vehicle: prefixData.brand + ' ' + prefixData.model + ' (前5位匹配) | VIN: ' + vin,
                            battery: prefixData.battery,
                            specs: prefixData.specs + '\n⚠️ 前5位匹配，请核对车型是否正确',
                            alts: []
                        });
                        matched = true;
                        break;
                    }
                }
            }
            
            // 第3优先：前3位品牌匹配 → 展示所有车型让用户选择
            if (!matched && decoded.matchedBrand && BATTERY_DB[decoded.matchedBrand]) {
                var brandData = BATTERY_DB[decoded.matchedBrand];
                var seriesList = Object.keys(brandData);
                
                // ✅ 不再返回第一个，而是展示所有车型让用户选择
                showModelSelection(decoded.matchedBrand, seriesList, vin);
                matched = true;
                    }
            
            // 未匹配到任何数据
            if (!matched) {
                showResult({
                    vehicle: '未识别品牌 | VIN: ' + vin,
                    battery: '暂无此VIN的电池数据',
                    specs: '建议：使用「车型选择」功能查询',
                    alts: []
                });
            }
        } catch(e) {
            alert('查询出错: ' + e.message);
            console.error('[queryByVin]', e);
        }
    }
    
    // ============ 展示车型选择列表 ============
    function showModelSelection(brand, seriesList, vin) {
        
        var resultSection = document.getElementById('result-card');
        if (!resultSection) {
            alert('错误：找不到结果区域');
            return;
        }
        
        var html = '<div class="result-card show" style="border-color: #f7b731;">'
            + '<div class="result-title">⚠️ 请选择具体车型</div>'
            + '<div class="vehicle-info">'
            + '<div>VIN: <span class="vin-display">' + vin + '</span></div>'
            + '<div>匹配品牌: <strong>' + brand + '</strong></div>'
            + '<div style="margin-top: 12px; color: #f7b731; font-size: 0.9rem;">请选择您的具体车型：</div>'
            + '</div>'
            + '<div style="max-height: 400px; overflow-y: auto; margin-top: 12px;">';
        
        seriesList.forEach(function(series) {
            var data = BATTERY_DB[brand][series];
            if (data && data.battery) {
                html += '<div class="result-battery" style="cursor: pointer;" onclick="selectModel(' + '\'' + brand + '\'' + ', ' + '\'' + series + '\'' + ', ' + '\'' + vin + '\'' + ')">'
                    + '<div class="model">' + series + '</div>'
                    + '<div class="specs">电池: <span>' + data.battery + '</span></div>'
                    + '<div class="specs">规格: <span>' + data.specs + '</span></div>'
                    + '</div>';
            }
        });
        
        html += '</div></div>';
        
        resultSection.innerHTML = html;
        resultSection.style.display = 'block';
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }
    
    // ============ 用户选择车型后 ============
    function selectModel(brand, series, vin) {
        
        var data = BATTERY_DB[brand][series];
        if (!data) {
            alert('错误：找不到车型数据');
            return;
        }
        
        showResult({
            vehicle: brand + ' ' + series + ' | VIN: ' + vin,
            battery: data.battery,
            specs: data.specs,
            alts: data.alts || []
        });
    }

    // ============ 使用拍照后的VIN查询 ============
    function queryByVinWithScanned() {
        try {
            var scannedEl = document.getElementById('scanned-vin');
            var vin = '';
            if (scannedEl && scannedEl.value.trim()) {
                vin = scannedEl.value.trim().toUpperCase();
            }
            
            if (!vin) {
                alert('请先输入或识别车架号');
                return;
            }
            
            // 写入主输入框
            var vinInput = document.getElementById('vin-input');
            if (vinInput) {
                vinInput.value = vin;
            }
            
            // 调用主查询
            queryByVin();
        } catch(e) {
            alert('查询出错: ' + e.message);
            console.error('[queryByVinWithScanned]', e);
        }
    }

    // ============ 车型查询 ============
    function queryByVehicle() {
        try {
            var brand = document.getElementById('brand-select').value;
            var series = document.getElementById('series-select').value;
            var year = document.getElementById('year-select').value;
            
            if (!brand || !series) {
                alert('请选择品牌和车系');
                return;
            }
            
            var data = (BATTERY_DB[brand] || {})[series];
            if (!data) {
                alert('未找到该车型数据');
                return;
            }
            
            var vehicleText = year ? brand + ' ' + series + ' (' + year + ')' : brand + ' ' + series;
            
            showResult({
                vehicle: vehicleText,
                battery: data.battery,
                specs: data.specs,
                alts: data.alts || []
            });
        } catch(e) {
            alert('查询出错: ' + e.message);
            console.error('[queryByVehicle]', e);
        }
    }

    // ============ 显示结果 ============
    function showResult(result) {
        try {
            var card = document.getElementById('result-card');
            if (!card) {
                console.error('[showResult] 找不到result-card');
                return;
            }
            
            // 用innerHTML重写整个卡片，避免showModelSelection覆盖后子元素丢失
            var specsHtml = '';
            if (result.specs) {
                specsHtml = result.specs
                    .replace(/\|/g, '<br>')
                    .replace(/规格:/g, '<span>规格:</span>')
                    .replace(/极性:/g, '<span>极性:</span>')
                    .replace(/冷启动电流:/g, '<span>冷启动电流:</span>')
                    .replace(/启停/g, '<span>启停</span>');
            }
            
            var altsHtml = '';
            if (result.alts && result.alts.length > 0) {
                altsHtml = '<div class="result-alts" style="display:block;">'
                    + '<div class="alts-title">💡 替代型号</div>'
                    + '<div>' + result.alts.map(function(alt) {
                        return '<span class="alt-item">' + alt + '</span>';
                    }).join('') + '</div></div>';
            }
            
            card.innerHTML = '<div class="result-title">✅ 查询结果</div>'
                + '<div class="vehicle-info" id="vehicle-info"><strong>📍 车型:</strong> <span class="vin-display">' + result.vehicle + '</span></div>'
                + '<div class="result-battery"><div class="model" id="battery-model">' + result.battery + '</div>'
                + '<div class="specs" id="battery-specs">' + specsHtml + '</div></div>'
                + altsHtml;
            
            card.classList.add('show');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch(e) {
            console.error('[showResult] 错误:', e);
            alert('显示结果时出错: ' + e.message);
        }
    }

    // ============ OCR.space 自动识别 ============
    function extractVinFromText(text) {
        var match = text.match(/[A-HJ-NPR-Z0-9]{17}/i);
        return match ? match[0].toUpperCase() : null;
    }
    
    function autoRecognizeVin(imageDataUrl) {
        var ocrGuide = document.getElementById('ocr-guide');
        var scannedVinInput = document.getElementById('scanned-vin');
        
        if (ocrGuide) ocrGuide.innerHTML = '🔍 <b>正在识别车架号...</b>';
        
        var formData = new FormData();
        formData.append('base64Image', imageDataUrl);
        formData.append('language', 'eng');
        formData.append('isOverlayRequired', 'false');
        formData.append('OCREngine', '2');
        
        fetch('https://api.ocr.space/parse/image', {
            method: 'POST',
            headers: {
                'apikey': 'K88793485688957'
            },
            body: formData
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
                var vin = null;
            if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                var fullText = data.ParsedResults[0].ParsedText || '';
                        vin = extractVinFromText(fullText);
            }
            
            if (vin) {
                if (scannedVinInput) scannedVinInput.value = vin;
                if (ocrGuide) ocrGuide.innerHTML = '✅ <b>自动识别成功！</b> 车架号已填入下方输入框，请确认后点击查询';
            } else {
                // OCR未能识别VIN，显示手动输入引导
                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                var isAndroid = /Android/.test(navigator.userAgent);
                var guide = isIOS
                    ? '⚠️ 自动识别未成功，请<b>长按上方图片</b> → 点「识别文字」→ 复制17位车架号 → 粘贴到下方输入框'
                    : isAndroid
                    ? '⚠️ 自动识别未成功，请<b>长按上方图片</b> → 点「识别图片中的文字」→ 复制17位车架号 → 粘贴到下方输入框'
                    : '⚠️ 自动识别未成功，请手动输入车架号';
                if (ocrGuide) ocrGuide.innerHTML = guide;
            }
        })
        .catch(function(err) {
            console.error('[autoRecognizeVin] OCR error:', err);
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            var isAndroid = /Android/.test(navigator.userAgent);
            var guide = isIOS
                ? '⚠️ 自动识别失败，请<b>长按上方图片</b> → 点「识别文字」→ 复制17位车架号 → 粘贴到下方输入框'
                : isAndroid
                ? '⚠️ 自动识别失败，请<b>长按上方图片</b> → 点「识别图片中的文字」→ 复制17位车架号 → 粘贴到下方输入框'
                : '⚠️ 自动识别失败，请手动输入车架号';
            if (ocrGuide) ocrGuide.innerHTML = guide;
        });
    }
    
    // ============ 原生相机处理 ============
    function initNativeCamera() {
        var nativeCamera = document.getElementById('native-camera');
        var albumPick = document.getElementById('album-pick');
        
        if (nativeCamera) {
            nativeCamera.addEventListener('change', handleNativeCapture);
        }
        if (albumPick) {
            albumPick.addEventListener('change', handleNativeCapture);
        }
    }
    
    function handleNativeCapture(e) {
        var file = e.target.files[0];
        if (!file) return;
        e.target.value = '';
        
        var reader = new FileReader();
        reader.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
                // 显示原图
                var resultDiv = document.getElementById('photo-result');
                var resultImg = document.getElementById('result-img');
                if (resultImg) resultImg.src = ev.target.result;
                
                if (resultDiv) {
                    resultDiv.style.display = 'block';
                    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                // 自动调用OCR.space识别
                autoRecognizeVin(ev.target.result);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    // ============ 扫描功能 ============
    function capturePhoto() {
        try {
            if (!snapCanvas) {
                snapCanvas = document.createElement('canvas');
                snapCtx = snapCanvas.getContext('2d');
            }
            var video = document.getElementById('scanner-video');
            var preview = document.getElementById('snap-preview');
            var hintEl = document.getElementById('scanner-hint');
            var controls = document.getElementById('scanner-controls');
            var captured = document.getElementById('scanner-captured');
            
            if (!video || !video.videoWidth) {
                if (hintEl) hintEl.innerHTML = '⚠️ 摄像头未就绪，请稍等1秒后重试';
                setTimeout(function() { capturePhoto(); }, 1000);
                return;
            }
            
            if (navigator.vibrate) navigator.vibrate(100);
            
            var vw = video.videoWidth;
            var vh = video.videoHeight;
            snapCanvas.width = vw;
            snapCanvas.height = vh;
            snapCtx.drawImage(video, 0, 0, vw, vh);
            
            if (preview) {
                // 显示原图，不做增强（保证微信OCR能识别文字）
                preview.src = snapCanvas.toDataURL('image/jpeg', 0.95);
                preview.style.display = 'block';
            }
            if (video) video.style.display = 'none';
            if (controls) controls.style.display = 'none';
            if (hintEl) hintEl.innerHTML = '📸 拍照完成！<br>👆 <b>长按上方图片</b> → 点「识别文字」→ 复制17位车架号 → 粘贴到下方输入框';
            
            // 不做图像增强，直接显示原图（让微信OCR能识别）
                
            if (captured) captured.classList.add('show');
            
            setTimeout(function() {
                var scannedVinInput = document.getElementById('scanned-vin');
                if (scannedVinInput) scannedVinInput.focus();
            }, 300);
        } catch(e) {
            console.error('[capturePhoto] 错误:', e);
        }
    }

    function retakePhoto() {
        var video = document.getElementById('scanner-video');
        var preview = document.getElementById('snap-preview');
        var hintEl = document.getElementById('scanner-hint');
        var controls = document.getElementById('scanner-controls');
        var captured = document.getElementById('scanner-captured');
        
        if (preview) {
            preview.style.display = 'none';
            preview.src = '';
        }
        if (video) video.style.display = 'block';
        if (controls) controls.style.display = 'flex';
        if (captured) captured.classList.remove('show');
        
        var scannedVin = document.getElementById('scanned-vin');
        if (scannedVin) scannedVin.value = '';
        
        if (hintEl) hintEl.innerHTML = '🎯 对准车架号，保持稳定，重新拍照';
    }

    // ============ 打开扫描器 ============
    function openScanner() {
        var overlay = document.getElementById('scanner-overlay');
        var video = document.getElementById('scanner-video');
        var hintEl = document.getElementById('scanner-hint');
        
        if (!overlay) return;
        overlay.classList.add('show');
        
        // 启动摄像头
        if (video && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function(s) {
                    stream = s;
                    video.srcObject = s;
                    video.play().catch(function(){});
                    if (hintEl) hintEl.innerHTML = '🎯 对准车架号，点拍照按钮';
                })
                .catch(function(err) {
                    console.error('[openScanner] 摄像头启动失败:', err);
                    if (hintEl) hintEl.innerHTML = '⚠️ 摄像头启动失败，请手动输入车架号';
                });
        } else {
            if (hintEl) hintEl.innerHTML = '⚠️ 浏览器不支持摄像头，请手动输入车架号';
        }
    }

    function closeScanner() {
        var overlay = document.getElementById('scanner-overlay');
        var video = document.getElementById('scanner-video');
        var preview = document.getElementById('snap-preview');
        var captured = document.getElementById('scanner-captured');
        var controls = document.getElementById('scanner-controls');
        
        if (stream) {
            stream.getTracks().forEach(function(track) { track.stop(); });
            stream = null;
        }
        
        if (video) {
            video.srcObject = null;
        }
        if (preview) {
            preview.style.display = 'none';
            preview.src = '';
        }
        if (video) video.style.display = 'block';
        if (controls) controls.style.display = 'flex';
        if (captured) captured.classList.remove('show');
        if (overlay) overlay.classList.remove('show');
        
        var scannedVin = document.getElementById('scanned-vin');
        if (scannedVin) scannedVin.value = '';
        
        var hintEl = document.getElementById('scanner-hint');
        if (hintEl) hintEl.innerHTML = '🎯 对准车架号，点拍照按钮';
        
        snapCanvas = null;
        snapCtx = null;
    }

    function confirmScan() {
        var vin = '';
        var overlayEl = document.getElementById('scanned-vin-overlay');
        if (overlayEl && overlayEl.value.trim()) {
            vin = overlayEl.value.trim().toUpperCase();
        }
        
        if (!validateVin(vin)) {
            alert('⚠️ 车架号格式不正确\n\n要求：大陆17位/港澳12-16位字母数字组合\n示例：LVKY9103LSX63950\n\n请检查后重新输入');
            return;
        }
        
        var vinInput = document.getElementById('vin-input');
        if (vinInput) vinInput.value = vin;
        
        closeScanner();
        queryByVin();
    }
