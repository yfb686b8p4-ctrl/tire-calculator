            padding: 16px;

        }
        .container { max-width: 100%; margin: 0 auto; }
        h1 {

        .subtitle {
            text-align: center;
            color: #888;

        }

            border-radius: 12px;
            padding: 18px;

            margin-bottom: 16px;
        }
        .card h2 {
            color: #f7b731;
            font-size: 1.1rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #b0b0b0;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #2d3a5a;
            border-radius: 10px;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #f7b731;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-secondary {
            background: #2d3a5a;
            color: #e0e0e0;
        }
        .btn-secondary:active { background: #3d4a6a; }
        .btn-scan {
            background: linear-gradient(135deg, #00b894, #00a884);
            color: #fff;
        }
        .result-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #00b894;
            margin-bottom: 16px;
            display: none;
        }
        .result-card.show { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            color: #00b894;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-battery {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #f7b731;
        }
        .result-battery .model {
            color: #f7b731;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result-battery .specs {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;

            color: #fff;
            font-weight: 500;
        }
        .result-alts {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 14px;
            border-left: 4px solid #6c5ce7;
        }
        .result-alts .alts-title {
            color: #6c5ce7;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

            display: inline-block;
            background: #2d3a5a;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;

            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .vehicle-info .vin-display {
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        .scanner-overlay.show { display: flex; }
        .scanner-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
        }
        .scanner-header h3 {
            color: #fff;
            font-size: 1rem;
        }
        .scanner-close {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .scanner-video-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 80px;
            border: 3px solid #00b894;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f7b731, transparent);
            animation: scanLine 1.2s ease-in-out infinite;
            box-shadow: 0 0 10px #f7b731, 0 0 20px rgba(247,183,49,0.4);
            border-radius: 2px;
        }
        @keyframes scanLine {
            0% { top: 8%; }
            50% { top: 88%; }
            100% { top: 8%; }
        }
        .scanner-hint {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            color: #aaa;
            font-size: 0.9rem;
        }
        .scanner-captured {
            display: none;
            padding: 16px;
            background: #1a1a2e;
        }
        .scanner-captured.show { display: block; }

            width: 100%;
            padding: 14px;
            border: 2px solid #2d3a5a;
            border-radius: 8px;
            background: #16213e;
            color: #f7b731;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;

        .scanner-controls {
            padding: 16px 20px;
            display: flex;
            justify-content: center;

            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7b731, #faa61a);
            border: 4px solid #fff;
            color: #1a1a2e;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(247,183,49,0.5);
            transition: all 0.2s;
        }

            display: flex;
            gap: 8px;
            margin-bottom: 16px;

        .tab {
            flex: 1;
            padding: 12px;
            background: #2d3a5a;
            border: none;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #f7b731, #faa61a);
            color: #1a1a2e;
            font-weight: 600;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f7b731;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Error state */
        .error-msg {
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid #e63946;
            border-radius: 8px;
            padding: 12px;
            color: #e63946;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }

    <div class="container">
        <h1>🔋 电池型号查询</h1>
        <p class="subtitle">输入车架号或选择车型，秒查适配电池</p>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('scan')">📷 扫码/VIN</button>
            <button class="tab" onclick="switchTab('select')">🚗 车型选择</button>
        </div>

        <!-- Tab 1: Scan / Manual VIN -->
        <div id="tab-scan" class="tab-content active">
            <div class="card">
                <h2>🔍 车架号查询</h2>
                <div class="input-group">
                    <label>车架号 (VIN)</label>
                    <input type="text" id="vin-input" placeholder="输入17位车架号" maxlength="17" autocomplete="off" style="text-transform: uppercase;">
                </div>
                <div class="error-msg" id="vin-error">车架号格式不正确，请输入17位VIN码</div>
                <div class="btn-row">
                    <button class="btn btn-scan" onclick="startScanner()">📷 扫码识别</button>
                    <button class="btn btn-primary" onclick="queryByVin()">查询</button>
                </div>
            </div>
        </div>

        <!-- Tab 2: Vehicle Select -->
        <div id="tab-select" class="tab-content">
            <div class="card">
                <h2>🚗 选择车型</h2>
                <div class="input-group">
                    <label>品牌</label>
                    <select id="brand-select" onchange="onBrandChange()">
                        <option value="">-- 请选择品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>车系</label>
                    <select id="series-select" onchange="onSeriesChange()" disabled>
                        <option value="">-- 先选品牌 --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>年份</label>
                    <select id="year-select" disabled>
                        <option value="">-- 先选车系 --</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="queryByVehicle()" style="flex:2">查询电池型号</button>
                </div>
            </div>
        </div>

        <!-- Result Area -->
        <div class="result-card" id="result-card">
            <div class="result-title">✅ 查询结果</div>
            <div class="vehicle-info" id="vehicle-info"></div>
            <div class="result-battery">
                <div class="model" id="battery-model"></div>
                <div class="specs" id="battery-specs"></div>
            </div>
            <div class="result-alts" id="result-alts">
                <div class="alts-title">💡 替代型号</div>
                <div id="alt-models"></div>
            </div>
        </div>
    </div>

    <!-- Scanner Overlay -->
    <div class="scanner-overlay" id="scanner-overlay">
        <div class="scanner-header">
            <h3>📷 扫描车架号</h3>
            <button class="scanner-close" onclick="closeScanner()">关闭</button>
        </div>
        <div class="scanner-video-container">
            <video id="scanner-video" autoplay playsinline></video>
            <div class="scanner-frame"></div>
            <img id="snap-preview" style="display:none;width:100%;height:100%;object-fit:contain;border-radius:8px;" />
        </div>
        <div class="scanner-hint" id="scanner-hint">
            🎯 对准车架号，点拍照按钮
        </div>
        <div class="scanner-controls" id="scanner-controls">
            <button class="btn btn-snap" id="btn-snap" onclick="capturePhoto()">📸 拍照识别</button>
        </div>
        <div class="scanner-captured" id="scanner-captured">
            <label style="color:#f7b731;font-size:0.9rem;margin-bottom:8px;display:block;">🔤 请输入/修正车架号（17位）</label>
            <input type="text" id="scanned-vin" maxlength="17" placeholder="如：LVKY9103LSX63950" style="text-transform:uppercase;font-size:1.1rem;letter-spacing:2px;text-align:center;">
            <div class="btn-row" style="margin-top:14px;">
                <button class="btn btn-secondary" onclick="retakePhoto()">🔄 重拍</button>
                <button class="btn btn-primary" onclick="confirmScan()">✅ 确认查询</button>
            </div>
        </div>
    </div>

    // ============ 初始化 ============
    document.addEventListener('DOMContentLoaded', function() {
        initBrandSelect();
    });

    function initBrandSelect() {
        const brandSelect = document.getElementById('brand-select');
        const brands = Object.keys(BATTERY_DB).sort();
        brands.forEach(brand => {
            const opt = document.createElement('option');
            opt.value = brand;
            opt.textContent = brand;
            brandSelect.appendChild(opt);
        });
    }

    function onBrandChange() {
        const brand = document.getElementById('brand-select').value;
        const seriesSelect = document.getElementById('series-select');
        const yearSelect = document.getElementById('year-select');
        
        seriesSelect.innerHTML = '<option value="">-- 请选择车系 --</option>';
        yearSelect.innerHTML = '<option value="">-- 先选车系 --</option>';
        yearSelect.disabled = true;
        
        if (!brand) {
            seriesSelect.disabled = true;
            return;
        }
        
        seriesSelect.disabled = false;
        const series = Object.keys(BATTERY_DB[brand] || {}).sort();
        series.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            seriesSelect.appendChild(opt);
        });
    }

    function onSeriesChange() {
        const brand = document.getElementById('brand-select').value;
        const series = document.getElementById('series-select').value;
        const yearSelect = document.getElementById('year-select');
        
        yearSelect.innerHTML = '<option value="">-- 请选择年份 --</option>';
        
        if (!brand || !series) {
            yearSelect.disabled = true;
            return;
        }
        
        yearSelect.disabled = false;
        const data = BATTERY_DB[brand]?.[series];
        if (data?.years) {
            data.years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            });
        }
    }

    // ============ Tab切换 ============
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    // ============ VIN查询 ============
    function validateVin(vin) {
        return vin.length === 17 && /^[A-HJ-NPR-Z0-9]{17}$/i.test(vin);
    }

    function decodeVin(vin) {
        // 简化解码: 根据前缀判断
        const prefix = vin.substring(0, 3).toUpperCase();
        const info = VIN_DECODER[prefix] || '未知品牌';
        
        // 尝试匹配数据库
        const brand = Object.keys(BATTERY_DB).find(b => info.includes(b));
        
        return {
            prefix: prefix,
            maker: info,
            matchedBrand: brand || null,
            year: vin.charAt(9), // 位置9是年份代码(简化)
        };
    }

    function queryByVin() {
        const vin = document.getElementById('vin-input').value.trim().toUpperCase();
        const errorEl = document.getElementById('vin-error');
        
        if (!validateVin(vin)) {
            errorEl.classList.add('show');
            return;
        }
        errorEl.classList.remove('show');
        
        const decoded = decodeVin(vin);
        
        // 如果能匹配品牌，尝试返回该品牌最常见车型
        if (decoded.matchedBrand) {
            const brandData = BATTERY_DB[decoded.matchedBrand];
            const firstSeries = Object.keys(brandData)[0];
            const data = brandData[firstSeries];
            
            showResult({
                vehicle: `${decoded.maker} | VIN: ${vin}`,
                battery: data.battery,
                specs: data.specs,
                alts: data.alts || []
            });
        } else {
            // 未能匹配，提示用户使用车型选择
            showResult({
                vehicle: `品牌: ${decoded.maker} | VIN: ${vin}`,
                battery: '需通过VIN确认品牌后查询',
                specs: '建议：使用「车型选择」功能直接选择您的车型',
                alts: []
            });
        }
    }

    // ============ 车型查询 ============
    function queryByVehicle() {
        const brand = document.getElementById('brand-select').value;
        const series = document.getElementById('series-select').value;
        const year = document.getElementById('year-select').value;
        
        if (!brand || !series) {
            alert('请选择品牌和车系');
            return;
        }
        
        const data = BATTERY_DB[brand]?.[series];
        if (!data) {
            alert('未找到该车型数据');
            return;
        }
        
        const vehicleText = year ? `${brand} ${series} (${year})` : `${brand} ${series}`;
        
        showResult({
            vehicle: vehicleText,
            battery: data.battery,
            specs: data.specs,
            alts: data.alts || []
        });
    }

    // ============ 显示结果 ============
    function showResult(result) {
        const card = document.getElementById('result-card');
        
        document.getElementById('vehicle-info').innerHTML = `
            <strong>📍 车型:</strong> <span class="vin-display">${result.vehicle}</span>
        `;
        
        document.getElementById('battery-model').textContent = result.battery;
        document.getElementById('battery-specs').innerHTML = result.specs.replace(/\|/g, '<br>').replace(/规格:/g, '<span>规格:</span>').replace(/极性:/g, '<span>极性:</span>').replace(/冷启动电流:/g, '<span>冷启动电流:</span>').replace(/启停/g, '<span>启停</span>');
        
        const altsContainer = document.getElementById('alt-models');
        if (result.alts && result.alts.length > 0) {
            document.getElementById('result-alts').style.display = 'block';
            altsContainer.innerHTML = result.alts.map(alt => 
                `<span class="alt-item">${alt}</span>`
            ).join('');
        } else {
            document.getElementById('result-alts').style.display = 'none';
        }
        
        card.classList.add('show');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

                { video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 } } },
                { video: { facingMode: 'environment' } },
                { video: { facingMode: 'user' } },
                { video: true }
            ];
            for (const cfg of configs) {
                try { stream = await navigator.mediaDevices.getUserMedia(cfg); break; } catch(e) {}
            }
            if (!stream) throw new Error('camera_unavailable');
            
            video.srcObject = stream;
            video.setAttribute('playsinline', '');
            video.setAttribute('autoplay', '');
            await video.play().catch(() => {});
            overlay.classList.add('show');
            
            snapCanvas = document.createElement('canvas');
            snapCtx = snapCanvas.getContext('2d');
            
        } catch (err) {
            console.error('Camera error:', err);
            const msg = err.message || '';
            if (/not.?allowed|permission|denied/i.test(msg)) {
                alert('⚠️ 请允许相机权限\n\n操作：\n1. 点击右上角「···」\n2. 设置 → 允许摄像头\n3. 重新进入此页面');
            } else if (/not.?found|no.?device/i.test(msg)) {
                alert('📱 未检测到摄像头\n\n请直接手动输入17位车架号');
            } else {
                alert('📷 相机无法打开\n\n请直接手动输入17位车架号');
            }
            // 即使失败也显示界面，引导用户手动输入
            overlay.classList.add('show');
            controls.innerHTML = '<button class="btn btn-primary" onclick="showManualInput()" style="font-size:1.2rem;padding:16px 32px;">📝 手动输入车架号</button>';
            hintEl.innerHTML = '⚠️ 摄像头不可用，请手动输入车架号';
        }
    }
    
    function showManualInput() {
        closeScanner();
        setTimeout(() => {
            const inp = document.getElementById('vin-input');
            if (inp) { inp.focus(); inp.scrollIntoView(); }
        }, 100);
    }

    // ========== 拍照 ==========
    function capturePhoto() {
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const hintEl = document.getElementById('scanner-hint');
        const controls = document.getElementById('scanner-controls');
        const captured = document.getElementById('scanner-captured');
        
        // iOS Safari兼容：视频可能未完全play
        if (!video.videoWidth && !video.videoHeight) {
            hintEl.innerHTML = '⚠️ 摄像头未就绪，请稍等1秒后重试';
            setTimeout(() => capturePhoto(), 1000);
            return;
        }
        
        if (!video.videoWidth || !video.videoHeight) {
            hintEl.innerHTML = '📸 已拍照，请输入车架号';
        }
        if (!video.videoWidth) return;
        
        // 振动反馈
        if (navigator.vibrate) navigator.vibrate(100);
        
        // 截取视频帧（全尺寸）
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        snapCanvas.width = vw;
        snapCanvas.height = vh;
        snapCtx.drawImage(video, 0, 0, vw, vh);
        
        // 显示拍照预览图
        preview.src = snapCanvas.toDataURL('image/jpeg', 0.9);
        preview.style.display = 'block';
        video.style.display = 'none';
        controls.style.display = 'none';
        hintEl.innerHTML = '🔄 AI识别中... (约3-5秒)';
        
        // ========== 自动OCR识别车架号 ==========
        (async function autoOCR() {
            try {
                // 图像预处理：转base64
                const imgData = snapCanvas.toDataURL('image/jpeg', 0.9);
                
                // 使用 Tesseract.js 识别（仅英文数字，轻量）
                const result = await Tesseract.recognize(imgData, 'eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round(m.progress * 100);
                            hintEl.innerHTML = '🔄 AI识别中... ' + pct + '%';
                        }
                    }
                });
                
                // 提取识别结果，过滤出VIN格式（17位字母数字）
                let text = result.data.text.toUpperCase().replace(/[^A-Z0-9]/g, '');
                
                // 尝试提取17位连续字母数字串
                let vinMatch = text.match(/[A-HJ-NPR-Z0-9]{17}/);
                if (vinMatch) {
                    document.getElementById('scanned-vin').value = vinMatch[0];
                    hintEl.innerHTML = '✅ 识别成功！请确认/修正车架号';
                } else if (text.length >= 10) {
                    // 取最长的连续串
                    document.getElementById('scanned-vin').value = text.substring(0, 17);
                    hintEl.innerHTML = '⚠️ 识别可能不准，请修正车架号';
                } else {
                    hintEl.innerHTML = '⚠️ 未能自动识别，请手动输入车架号';
                }
                
            } catch (err) {
                console.error('OCR error:', err);
                hintEl.innerHTML = '⚠️ 自动识别失败，请手动输入车架号';
            }
        })();
        
        // 显示输入确认区
        captured.classList.add('show');
        
        // 聚焦输入框（弹出键盘方便输入）
        setTimeout(() => {
            document.getElementById('scanned-vin').focus();
        }, 300);
    }

    // ========== 重拍 ==========
    function retakePhoto() {
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const hintEl = document.getElementById('scanner-hint');
        const controls = document.getElementById('scanner-controls');
        const captured = document.getElementById('scanner-captured');
        
        preview.style.display = 'none';
        preview.src = '';
        video.style.display = 'block';
        controls.style.display = 'flex';
        captured.classList.remove('show');
        document.getElementById('scanned-vin').value = '';
        hintEl.innerHTML = '🎯 对准车架号，保持稳定，重新拍照';
    }

    // ========== 关闭扫描 ==========
    function closeScanner() {
        const overlay = document.getElementById('scanner-overlay');
        const video = document.getElementById('scanner-video');
        const preview = document.getElementById('snap-preview');
        const captured = document.getElementById('scanner-captured');
        const controls = document.getElementById('scanner-controls');
        
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
        
        video.srcObject = null;
        preview.style.display = 'none';
        preview.src = '';
        video.style.display = 'block';
        controls.style.display = 'flex';
        captured.classList.remove('show');
        overlay.classList.remove('show');
        document.getElementById('scanned-vin').value = '';
        document.getElementById('scanner-hint').innerHTML = '🎯 对准车架号，点拍照按钮';
        snapCanvas = null;
        snapCtx = null;
    }

    // ========== 确认查询 ==========
    function confirmScan() {
        const vin = document.getElementById('scanned-vin').value.trim().toUpperCase();
        if (!validateVin(vin)) {
            alert('⚠️ 车架号格式不正确\n\n要求：17位字母数字组合\n示例：LVKY9103LSX63950\n\n请检查后重新输入');
            return;
        }
        document.getElementById('vin-input').value = vin;
        closeScanner();
        queryByVin();
    }

    // VIN输入自动大写
    document.getElementById('vin-input').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });

    document.getElementById('scanned-vin').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });
    </script>
</body>
</html>
